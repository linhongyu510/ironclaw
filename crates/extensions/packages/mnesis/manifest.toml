schema_version = "reborn.extension_manifest.v3"
id = "mnesis.hosted.memory"
name = "Mnesis Memory"
version = "0.1.0"
description = "Mnesis backend for the always-on memory adapter, reached over a published hosted-MCP boundary. A compose-time [memory] binding can select this provider in place of the native filesystem backend. Mnesis exposes two separately authorized lanes: retrieval (knowledge_search) and memory (memory_search). Off by default; fails closed unless a deployment binds it and supplies both endpoints plus a host-owned bearer credential handle."
trust = "first_party_requested"

[runtime]
kind = "first_party"
service = "mnesis_memory_provider"

[memory]
lifecycle = ["read_long_term"]

[[tools]]
id = "ironclaw.memory.search"
description = "Search Mnesis for prior context relevant to the current turn, across the retrieval and memory lanes."
effects = ["read_filesystem"]
default_permission = "allow"
visibility = "model"
origin_gate_matrix = { loop_run = "ungated", product = "forbidden", automation = "forbidden" }
input_schema_ref = "schemas/memory/search.input.v1.json"
output_schema_ref = "schemas/memory/search.output.v1.json"
prompt_doc_ref = "prompts/mnesis/search.md"
