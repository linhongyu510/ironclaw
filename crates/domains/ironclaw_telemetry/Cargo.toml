[package]
name = "ironclaw_telemetry"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Tenant-scoped BI telemetry aggregation and persistence domain"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
deadpool-postgres = "0.14"
ironclaw_libsql_runtime = { path = "../../substrates/ironclaw_libsql_runtime", version = "0.1.0" }
ironclaw_telemetry_contracts = { path = "../../contracts/ironclaw_telemetry_contracts", version = "0.1.0" }
libsql = { version = "0.9", default-features = false, features = ["core", "replication", "remote", "tls"] }
thiserror = "2"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
tempfile = "3"
testcontainers-modules = { version = "0.12", features = ["postgres"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
