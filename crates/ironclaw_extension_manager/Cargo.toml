[package]
name = "ironclaw_extension_manager"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Product face of extensions: lifecycle commands/capabilities, the lifecycle product service, admin/operator capability handlers, and the extension hub for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "products"

[features]
# Lightweight in-crate test fixtures (the full lifecycle service bundle)
# reused by downstream integration tests. Zero-byte in production.
test-support = [
    "dep:ironclaw_first_party_extensions",
    "ironclaw_auth/test-support",
    "ironclaw_extension_host/test-support",
    "ironclaw_filesystem/test-support",
    "ironclaw_processes/test-support",
]

[dependencies]
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
ironclaw_approvals = { path = "../ironclaw_approvals" }
ironclaw_auth = { path = "../ironclaw_auth" }
ironclaw_authorization = { path = "../ironclaw_authorization" }
ironclaw_extension_contracts = { path = "../ironclaw_extension_contracts", version = "0.1.0" }
ironclaw_extension_host = { path = "../ironclaw_extension_host" }
ironclaw_extensions = { path = "../ironclaw_extensions" }
ironclaw_first_party_extensions = { path = "../ironclaw_first_party_extensions", optional = true }
ironclaw_filesystem = { path = "../ironclaw_filesystem" }
ironclaw_host_api = { path = "../ironclaw_host_api" }
ironclaw_host_runtime = { path = "../ironclaw_host_runtime" }
ironclaw_loop_contracts = { path = "../ironclaw_loop_contracts", version = "0.1.0" }
ironclaw_network = { path = "../ironclaw_network" }
ironclaw_processes = { path = "../ironclaw_processes" }
ironclaw_product = { path = "../ironclaw_product" }
ironclaw_product_contracts = { path = "../ironclaw_product_contracts", version = "0.1.0" }
ironclaw_reborn_config = { path = "../ironclaw_reborn_config" }
ironclaw_resources = { path = "../ironclaw_resources" }
ironclaw_safety = { path = "../ironclaw_safety" }
ironclaw_secrets = { path = "../ironclaw_secrets" }
ironclaw_skills = { path = "../ironclaw_skills" }
ironclaw_triggers = { path = "../ironclaw_triggers" }
ironclaw_trust = { path = "../ironclaw_trust" }
ed25519-dalek = "2.2.0"
hex = "0.4.3"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
url = "2"

[dev-dependencies]
ironclaw_auth = { path = "../ironclaw_auth", features = ["test-support"] }
ironclaw_extension_host = { path = "../ironclaw_extension_host", features = ["test-support"] }
ironclaw_filesystem = { path = "../ironclaw_filesystem", features = ["test-support"] }
ironclaw_first_party_extensions = { path = "../ironclaw_first_party_extensions" }
ironclaw_host_api = { path = "../ironclaw_host_api", features = ["test-support"] }
ironclaw_host_runtime = { path = "../ironclaw_host_runtime", features = ["test-support"] }
ironclaw_processes = { path = "../ironclaw_processes", features = ["test-support"] }
ironclaw_product = { path = "../ironclaw_product", features = ["test-support"] }
ironclaw_resources = { path = "../ironclaw_resources", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
# `tracing` short-circuits on the null dispatcher, so a plain unit test cannot
# tell "logged the cause" apart from "dropped it" — and the sanitized 503 body
# makes that distinction the whole point of the lifecycle warning. Installing a
# scoped subscriber is the only way to assert the diagnostic actually survives.
tracing-subscriber = "0.3"
