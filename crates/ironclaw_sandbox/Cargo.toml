[package]
name = "ironclaw_sandbox"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ironclaw]
layer = "runtimes"

[dependencies]
# The Docker/CA cone lives here and nowhere else — keeping it out of the kernel
# is the reason this crate exists (PROPOSAL §6.6.4).
bollard = "0.18"
rcgen = "0.14"
libc = "0.2"
time = { version = "0.3", default-features = false }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
futures-util = "0.3"
ironclaw_extension_contracts = { path = "../ironclaw_extension_contracts", version = "0.1.0" }
ironclaw_common = { path = "../ironclaw_common" }
ironclaw_host_api = { path = "../ironclaw_host_api", version = "0.1.0" }
ironclaw_network = { path = "../ironclaw_network" }
ironclaw_safety = { path = "../ironclaw_safety" }
ironclaw_secrets = { path = "../ironclaw_secrets" }
ironclaw_resources = { path = "../ironclaw_resources" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "rt", "time"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# Lane tests build a real ExtensionPackage and project the three inputs the
# script lane takes, proving the projection against a parsed manifest.
# Dev-only: the production dependency is gone, which is what the layer matrix
# measures.
ironclaw_extensions = { path = "../ironclaw_extensions" }
rust_decimal_macros = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
x509-parser = { version = "0.18", features = ["verify"] }
