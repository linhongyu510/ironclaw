# Cross-binary parallel test runner config for cargo-nextest.
# See https://nexte.st/docs/configuration/ for the full schema.
#
# Profiles:
# - default — `cargo nextest run` (local dev)
# - ci      — `cargo nextest run --profile ci` (GitHub Actions)

[profile.default]
# Per-test slow warning: nextest prints "SLOW" for every `period`; after
# `terminate-after` warnings it kills the process. 60s/3 catches obvious
# hangs without surprising tests that happen to run ~45-55s on a loaded
# laptop. Raise per-test via the `[[overrides]]` block below.
slow-timeout = { period = "60s", terminate-after = 3 }
# Leak detection fires if a test spawns threads/processes that outlive it;
# the default 100ms grace is fine.
leak-timeout = "100ms"

[profile.ci]
# One flake shouldn't mask other real failures.
fail-fast = false
# Determinism over green-washing: no automatic retries in CI.
retries = 0
# Inline failures, suppress passing noise, keep Actions logs scannable.
failure-output = "immediate-final"
success-output = "never"
# Per-test hang ceiling: warn every 60s, kill after 10 missed warnings
# (10m). Replaces the old per-BINARY 28m `timeout` as the hang backstop,
# catching a stuck test at test granularity instead of job granularity
# (the 91-122min queue hangs the gate-audit measured were bounded only by
# a 90m job timeout).
slow-timeout = { period = "60s", terminate-after = 10 }
# 2-core/~7GB runners: bound concurrent test PROCESSES to the actual core
# count. nextest's built-in default already resolves to logical-CPU
# count, but leaving it implicit makes "RUST_MIN_STACK=64MiB (job env) x
# concurrent per-test tokio runtimes" an unreviewable number. Pin it.
test-threads = "num-cpus"

[profile.ci.junit]
# One JUnit report per nextest invocation. Job steps copy it out before
# the next invocation in the same step would overwrite it (crate-tests'
# exact-targets loop runs nextest more than once per step) -- see Tasks
# 3-5's recipes. Consumed by scripts/ci/junit_summary.py in the required
# aggregator (Task 1) to report failing TEST names, not just job names.
path = "junit.xml"

# --- Serialised groups -------------------------------------------------
#
# `ironclaw`'s CLI smoke tests boot a real `serve` listener. Their helper
# picks a port by binding :0, reading the number, then RELEASING it before
# the child re-binds -- a TOCTOU window the helper's own comment refuses to
# paper over ("a small serialization fix, not a port-reservation
# framework -- do not extend it into a pool or retry-with-backoff
# mechanism"). Under `cargo test` those 20 tests shared one process and the
# window stayed narrow; nextest runs each test in its own process, widening
# it until two tests race for the same port and the loser reports
# "connect to serve listener failed: Connection refused".
#
# Observed on this branch: onboard_login_link_then_bearer_authorizes_a_
# protected_request, 1 of 1417 tests, in the reborn-core bucket.
#
# The rule this follows is the plan's own: a nextest-only failure gets
# serialised here, never "fixed" by editing the test. Only the listener
# tests join the group -- the other ~128 smoke tests stay parallel.
[test-groups]
cli-serve-listener = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(ironclaw) & binary(smoke) & (test(~serve) | test(~onboard_) | test(~stored_key_reaches) | test(a_real_env_var_beats_the_config_default_end_to_end))'
test-group = "cli-serve-listener"

[[profile.ci.overrides]]
filter = 'package(ironclaw) & binary(smoke) & (test(~serve) | test(~onboard_) | test(~stored_key_reaches) | test(a_real_env_var_beats_the_config_default_end_to_end))'
test-group = "cli-serve-listener"

# Per-test windows for the handful of scenarios that genuinely need more
# than 60s (live-recorded fixtures + heavy integration).
[[profile.default.overrides]]
filter = "test(~e2e_thread_scheduling) | test(~heavy_integration)"
slow-timeout = { period = "300s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = "test(~e2e_thread_scheduling) | test(~heavy_integration)"
slow-timeout = { period = "300s", terminate-after = 2 }

# Root/integration-tier suites drive whole Reborn turns; give them a
# 20-minute per-test ceiling (still far under the old 28m per-binary cap).
# Must stay BELOW the test-name override above: nextest takes the first
# matching [[profile.ci.overrides]] block, and a package-level filter
# would otherwise shadow the two named-test overrides for suites inside
# ironclaw_integration_tests.
[[profile.ci.overrides]]
filter = "package(ironclaw_integration_tests)"
slow-timeout = { period = "120s", terminate-after = 10 }
