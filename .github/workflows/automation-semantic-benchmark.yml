name: Automation Semantic Benchmark
run-name: Automation semantic benchmark for PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: automation-semantic-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare benchmark binaries
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.label.name == 'automation-semantic-benchmark' &&
      contains(github.event.pull_request.labels.*.name, 'automation-semantic-benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      baseline_ref: ${{ steps.refs.outputs.baseline_ref }}
      candidate_ref: ${{ steps.refs.outputs.candidate_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve exact candidate and default-branch baseline
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_REF}"
          default_branch="$(gh api "repos/${REPO}" --jq '.default_branch')"
          baseline_ref="$(gh api "repos/${REPO}/commits/${default_branch}" --jq '.sha')"
          echo "baseline_ref=${baseline_ref}" >> "${GITHUB_OUTPUT}"
          echo "candidate_ref=${CANDIDATE_REF}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ steps.refs.outputs.baseline_ref }}
          path: .automation-semantic/baseline
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Build isolated benchmark binaries
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="${RUNNER_TEMP}/automation-semantic/candidate" \
            cargo build --locked -p ironclaw --bin ironclaw
          (
            cd .automation-semantic/baseline
            CARGO_TARGET_DIR="${RUNNER_TEMP}/automation-semantic/baseline" \
              cargo build --locked -p ironclaw --bin ironclaw
          )
          mkdir -p artifacts/automation-semantic-binaries
          cp "${RUNNER_TEMP}/automation-semantic/candidate/debug/ironclaw" \
            artifacts/automation-semantic-binaries/candidate
          cp "${RUNNER_TEMP}/automation-semantic/baseline/debug/ironclaw" \
            artifacts/automation-semantic-binaries/baseline
          chmod 755 artifacts/automation-semantic-binaries/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-semantic-binaries-${{ github.event.pull_request.head.sha }}
          path: artifacts/automation-semantic-binaries/
          if-no-files-found: error
          retention-days: 1

  collect:
    name: Collect ${{ matrix.arm }} repetition ${{ matrix.repetition }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [baseline, candidate]
        repetition: [1, 2, 3, 4, 5]
    env:
      STRICT_ARTIFACT_SCRUB: "true"
      REBORN_WEBUI_V2_LIVE_QA_LLM_API_KEY_ENV: NEARAI_API_KEY
      REBORN_WEBUI_V2_LIVE_QA_LLM_PROVIDER_ID: nearai
      REBORN_WEBUI_V2_LIVE_QA_LLM_MODEL: ${{ vars.REBORN_WEBUI_V2_LIVE_QA_LLM_MODEL || 'deepseek-ai/DeepSeek-V4-Flash' }}
      REBORN_WEBUI_V2_LIVE_QA_LLM_JUDGE: "1"
      REBORN_WEBUI_V2_LIVE_QA_LLM_JUDGE_MODEL: ${{ vars.REBORN_WEBUI_V2_LIVE_QA_LLM_JUDGE_MODEL || vars.REBORN_WEBUI_V2_LIVE_QA_LLM_MODEL || 'deepseek-ai/DeepSeek-V4-Flash' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare.outputs.candidate_ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: automation-semantic-binaries-${{ needs.prepare.outputs.candidate_ref }}
          path: .automation-semantic/binaries
      - name: Install selected binary
        env:
          ARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/automation-semantic/target/debug"
          cp ".automation-semantic/binaries/${ARM}" \
            "${RUNNER_TEMP}/automation-semantic/target/debug/ironclaw"
          chmod 755 "${RUNNER_TEMP}/automation-semantic/target/debug/ironclaw"
      - name: Materialize live model secret
        env:
          NEARAI_API_KEY: ${{ secrets.NEARAI_API_KEY || secrets.LIVE_OPENAI_COMPATIBLE_API_KEY }}
        run: |
          set +x
          set -euo pipefail
          test -n "${NEARAI_API_KEY:-}"
          secret_dir="${RUNNER_TEMP}/automation-semantic-secrets"
          mkdir -p "${secret_dir}"
          chmod 700 "${secret_dir}"
          printf '%s' "${NEARAI_API_KEY}" > "${secret_dir}/NEARAI_API_KEY"
          chmod 600 "${secret_dir}/NEARAI_API_KEY"
          echo "NEARAI_API_KEY_PATH=${secret_dir}/NEARAI_API_KEY" >> "${GITHUB_ENV}"
      - name: Run eight-case semantic corpus
        env:
          ARM: ${{ matrix.arm }}
          REPETITION: ${{ matrix.repetition }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/automation-semantic/target
        run: |
          set -euo pipefail
          output="artifacts/automation-semantic/${ARM}-${REPETITION}"
          python3 scripts/reborn_webui_v2_live_qa/run_live_qa.py \
            --case automation_semantic_benchmark \
            --output-dir "${output}" \
            --reborn-home "${RUNNER_TEMP}/automation-semantic/missing-home" \
            --skip-build \
            --playwright-install with-deps
          printf '{"arm":"%s","repetition":%s}\n' "${ARM}" "${REPETITION}" \
            > "${output}/metadata.json"
      - name: Remove generated homes and scrub result artifact
        id: scrub
        if: always()
        env:
          ARM: ${{ matrix.arm }}
          REPETITION: ${{ matrix.repetition }}
        run: |
          output="artifacts/automation-semantic/${ARM}-${REPETITION}"
          rm -rf "${output}/reborn-home" "${output}/generated-reborn-home"
          scripts/live-canary/scrub-artifacts.sh "${output}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.scrub.outcome == 'success'
        with:
          name: automation-semantic-${{ matrix.arm }}-${{ matrix.repetition }}
          path: |
            artifacts/automation-semantic/${{ matrix.arm }}-${{ matrix.repetition }}/
            !artifacts/automation-semantic/**/llm-traces/**
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Blind semantic comparison
    needs: [prepare, collect]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      STRICT_ARTIFACT_SCRUB: "true"
      REBORN_WEBUI_V2_LIVE_QA_LLM_API_KEY_ENV: NEARAI_API_KEY
      REBORN_WEBUI_V2_LIVE_QA_LLM_JUDGE_MODEL: ${{ vars.REBORN_WEBUI_V2_LIVE_QA_LLM_JUDGE_MODEL || vars.REBORN_WEBUI_V2_LIVE_QA_LLM_MODEL || 'deepseek-ai/DeepSeek-V4-Flash' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare.outputs.candidate_ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: automation-semantic-*
          path: artifacts/automation-semantic-input
      - name: Materialize blind-judge secret
        env:
          NEARAI_API_KEY: ${{ secrets.NEARAI_API_KEY || secrets.LIVE_OPENAI_COMPATIBLE_API_KEY }}
        run: |
          set +x
          set -euo pipefail
          secret_dir="${RUNNER_TEMP}/automation-semantic-secrets"
          mkdir -p "${secret_dir}"
          chmod 700 "${secret_dir}"
          printf '%s' "${NEARAI_API_KEY}" > "${secret_dir}/NEARAI_API_KEY"
          chmod 600 "${secret_dir}/NEARAI_API_KEY"
          echo "NEARAI_API_KEY_PATH=${secret_dir}/NEARAI_API_KEY" >> "${GITHUB_ENV}"
      - name: Aggregate deterministic, rubric, and blind pairwise evidence
        id: benchmark
        continue-on-error: true
        run: >-
          python3 scripts/automation_ab/benchmark.py
          --input-root artifacts/automation-semantic-input
          --output-dir artifacts/automation-semantic-report
      - name: Scrub benchmark report
        run: scripts/live-canary/scrub-artifacts.sh artifacts/automation-semantic-report
      - name: Publish benchmark summary
        run: cat artifacts/automation-semantic-report/benchmark.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Publish PR benchmark evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker="<!-- automation-semantic-benchmark:evidence -->"
          body_file="${RUNNER_TEMP}/automation-semantic-comment.md"
          { echo "${marker}"; cat artifacts/automation-semantic-report/benchmark.md; } > "${body_file}"
          comment_id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --paginate --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -1)"
          if [[ -n "${comment_id}" ]]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${comment_id}" \
              -f body="$(cat "${body_file}")" >/dev/null
          else
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file "${body_file}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-semantic-report-${{ needs.prepare.outputs.candidate_ref }}
          path: artifacts/automation-semantic-report/
          if-no-files-found: error
          retention-days: 30
      - name: Fail loud on blocked or regressed benchmark
        if: steps.benchmark.outcome != 'success'
        run: exit 1
